name: optikpi_inapp
description: OptiKPI in-app pop-ups for Flutter apps. Fetches a player's waiting pop-ups, draws them over the app and reports impression, click and dismiss.
version: 0.1.0
publish_to: 'none'
repository: https://github.com/gamingcrafts/optikpi-inapp-sdk/tree/main/flutter

environment:
  sdk: ^3.7.2
  flutter: '>=3.29.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.3.0
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
